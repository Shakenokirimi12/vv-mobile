buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26  // react-native-voicevox が minSdk 26 を要求
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // react-native-voicevox が依存する公式 voicevoxcore-android AAR
        // (Maven Central 未公開のため、パッケージ同梱の local-maven から解決する)
        maven { url("${rootDir}/../node_modules/react-native-voicevox/android/vendored/local-maven") }
    }
}
