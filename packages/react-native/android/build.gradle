// react-native-voicevox (Android)
// vendored ディレクトリ(Kotlin実装・assets・jniLibs・local-maven)は
// ../scripts/prepare-sources.sh が packages/android から複製して配置する。
// AGP / Kotlin プラグインは RN アプリの root buildscript のものをそのまま使う
// (ここで AGP を再ロードすると別クラスローダの android 拡張になり
//  「compileSdk 未指定」エラーになる)。kotlinx-serialization の
// コンパイラプラグインだけは root に無いため、ここで classpath に追加する。
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-serialization:2.1.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.serialization"

android {
    namespace = "com.voicevox"
    compileSdk = 35

    defaultConfig {
        minSdk = 26

        externalNativeBuild {
            cmake {
                cppFlags "-frtti -fexceptions -Wall"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    // ReactAndroid / NitroModules の prefab(ネイティブ依存)を利用する
    buildFeatures {
        prefab = true
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs += "vendored/kotlin"
            assets.srcDirs += "vendored/assets"
            jniLibs.srcDirs += "vendored/jniLibs"
        }
    }
}

repositories {
    google()
    mavenCentral()
    // 公式 voicevoxcore-android AAR(prepare-sources.sh が展開)
    maven { url = uri("$projectDir/vendored/local-maven") }
}

dependencies {
    implementation "jp.hiroshiba.voicevoxcore:voicevoxcore-android:0.16.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.facebook.react:react-android"
    implementation project(":react-native-nitro-modules")
}

apply from: "../nitrogen/generated/android/RNVoicevox+autolinking.gradle"
