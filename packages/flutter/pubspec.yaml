name: voicevox_flutter
description: >-
  VOICEVOX CORE binding for Flutter. Text-to-speech synthesis with runtime
  voice model download and per-character license gating.
version: 0.1.0
homepage: https://github.com/vv-mobile/vv-mobile

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pool: ^1.5.1
  shared_preferences: ^2.3.2

dev_dependencies:
  ffigen: ^17.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: VoicevoxFlutterPlugin
        ffiPlugin: true
      macos:
        pluginClass: VoicevoxFlutterPlugin
        ffiPlugin: true
  assets:
    - assets/licenses.json
    - assets/open_jtalk_dic/
